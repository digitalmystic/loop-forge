    forbidden_role: authoritative-record-without-verification
    trust: pending-review
    local_first: true

  - id: project-nomad
    repo: digitalmystic/project-nomad
    upstream: Crosstalk-Solutions/project-nomad
    domain: resilience
    class: D
    candidate_class: B
    status: CONDITIONAL
    role: offline resilient node research
    forbidden_role: nexus-core
    trust: pending-review

  - id: portmaster
    repo: digitalmystic/portmaster
    upstream: safing/portmaster
